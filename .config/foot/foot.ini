# Настройки шрифта
font=JetBrains Mono Nerd Font:size=14, Symbols Nerd Font:size=14

[scrollback]
# Количество строк в истории прокрутки (больше — больше памяти, 1000-2000 оптимально)
lines=2000 

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
# Слегка прозрачный темный фон (значение alpha от 0.0 до 1.0)
# Отлично смотрится поверх ваших живых обоев mpvpaper!
alpha=0.90
background=1a1b26
foreground=c0caf5

# Палитра цветов (в стиле Tokyo Night)
regular0=15161e # black
regular1=f7768e # red
regular2=9ece6a # green
regular3=e0af68 # yellow
regular4=7aa2f7 # blue
regular5=bb9af7 # magenta
regular6=7dcfff # cyan
regular7=a9b1d6 # white
[key-bindings]
show-urls-launch=Control+Shift+l
